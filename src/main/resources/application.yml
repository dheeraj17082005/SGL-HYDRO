spring:
  application:
    name: cng-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgl_cng}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.sabarmati.cng: DEBUG

vehicle:
  verification:
    provider: ${VEHICLE_VERIFICATION_PROVIDER:mock}

rapidapi:
  key: ${RAPIDAPI_KEY:}
  host: ${RAPIDAPI_HOST:vehicle-rc-information.p.rapidapi.com}
  url: ${RAPIDAPI_URL:https://vehicle-rc-information.p.rapidapi.com/}

